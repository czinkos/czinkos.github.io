<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entitás tár</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="/pagefind/pagefind-ui.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col">
  <div class="h-2 w-full flex">
    <div class="h-full w-1/4 bg-kassak-red"></div>
    <div class="h-full w-1/4 bg-kassak-yellow"></div>
    <div class="h-full w-1/4 bg-black"></div>
    <div class="h-full w-1/4 bg-kassak-blue"></div>
  </div>
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-black text-white px-4 py-2 z-50">Ugrás a tartalomhoz</a>

  <header class="border-b-8 border-black py-10 px-6 mb-16" data-pagefind-ignore>
    <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
      <h1 class="text-3xl font-black uppercase tracking-tighter"><a href="/">Kassák<span class="text-gray-400">.</span>Levelezés</a></h1>
      <nav>
        <ul class="flex gap-8 text-[10px] uppercase tracking-[0.2em] font-black">
          <li><a href="/" class="hover:bg-black hover:text-white px-2 py-1 transition-all border-b-2 border-transparent hover:border-kassak-red">Főoldal</a></li>
          <li><a href="/entitas-tar/" class="hover:bg-black hover:text-white px-2 py-1 transition-all border-b-2 border-transparent hover:border-kassak-yellow">Entitás tár</a></li>
          <li><a href="/impresszum/" class="hover:bg-black hover:text-white px-2 py-1 transition-all border-b-2 border-transparent hover:border-kassak-blue">Impresszum</a></li>
        </ul>
      </nav>
    </div>
  </header>


  <main id="main-content" class="container mx-auto px-6 flex-grow" tabindex="-1">
    
<section class="max-w-4xl mx-auto py-12">
  <header class="mb-16 border-b-4 border-black pb-8">
    <h2 class="text-4xl font-black uppercase tracking-tighter">Entitás tár</h2>
    <p class="text-sm text-gray-400 mt-2 uppercase tracking-widest font-bold">Mutatók és referenciák</p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- People Card -->
    <a href="/indices/people/" class="group border-2 border-black p-8 hover:bg-black hover:text-white transition-all flex flex-col justify-between aspect-square">
      <div>
        <h3 class="text-xs uppercase tracking-widest mb-4 opacity-50 font-black">Adattár</h3>
        <h4 class="text-3xl font-black uppercase leading-none">Személyek<br/>mutatója</h4>
      </div>
      <div class="flex justify-between items-end">
        <span class="text-[10px] uppercase font-bold tracking-widest">2 bejegyzés</span>
        <span class="text-2xl group-hover:translate-x-2 transition-transform">→</span>
      </div>
    </a>

    <!-- Places Card -->
    <a href="/indices/places/" class="group border-2 border-black p-8 hover:bg-black hover:text-white transition-all flex flex-col justify-between aspect-square">
      <div>
        <h3 class="text-xs uppercase tracking-widest mb-4 opacity-50 font-black">Adattár</h3>
        <h4 class="text-3xl font-black uppercase leading-none">Helyszínek<br/>mutatója</h4>
      </div>
      <div class="flex justify-between items-end">
        <span class="text-[10px] uppercase font-bold tracking-widest">2 bejegyzés</span>
        <span class="text-2xl group-hover:translate-x-2 transition-transform">→</span>
      </div>
    </a>
  </div>
</section>

  </main>

  <footer class="mt-16 border-t border-black py-8 px-6 text-xs text-center" data-pagefind-ignore>
    <p>&copy; 2026 Kassák Múzeum | Digitális kritikai kiadás</p>
  </footer>
</body>
</html>
